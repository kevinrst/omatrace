[package]
name = "rewindd"
version = "0.1.0"
edition = "2021"
description = "Rewind daemon: sampling, 24h SQLite history, Unix-socket JSON IPC"

[[bin]]
name = "rewindd"
path = "src/main.rs"

[dependencies]
rewind-core = { path = "../rewind-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
sysinfo = "0.39.2"
chrono = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
