[package]
name = "omatraced"
version = "0.1.0"
edition = "2021"
description = "Omatrace daemon: sampling, in-memory history, Unix-socket JSON IPC"

[[bin]]
name = "omatraced"
path = "src/main.rs"

[dependencies]
omatrace-core = { path = "../omatrace-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.39.2"
chrono = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
